name: Python Tests

on:
  push:
    branches-ignore: [ '**' ]
    # branches: [ main ]  # temporarily ignore all branches while python tests are implemented
  pull_request:
    branches-ignore: [ '**' ]
    # branches: [ main ]  # temporarily ignore all branches while python tests are implemented

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build Docker image
      run: docker build -t python-tests .

    - name: Run Python tests
      run: docker run --rm -v ${{ github.workspace }}:/app python-tests uv run pytest